[package]
name = "weft"
version = "0.1.0"
edition = "2024"
description = "A coding agent for the terminal that runs two local models in tandem through LM Studio."

[dependencies]
anyhow = "1.0.104"
bytes = "1.10.1"
clap = { version = "4.6.7", features = ["derive"] }
futures-util = "0.3.34"
reqwest = { version = "0.13.5", features = ["json", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util"] }
toml = "1.1.8"

[dev-dependencies]
tempfile = "3.27"
