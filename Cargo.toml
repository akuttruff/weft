[package]
name = "weft"
version = "0.1.0"
edition = "2024"
description = "A coding agent for the terminal that runs two local models in tandem through LM Studio."

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
bytes = "1.10.1"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures-util = "0.3.34"
ignore = "0.4.33"
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info", "scrolling-regions"] }
regex = "1.13.1"
reqwest = { version = "0.13.5", features = ["json", "stream"] }
rmcp = { version = "3.7.0", features = ["client", "transport-child-process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
similar = "3.2.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "process", "signal"] }
tokio-util = "0.7.18"
unicode-width = "0.2.0"
toml = "1.1.8"

[dev-dependencies]
tempfile = "3.27"
